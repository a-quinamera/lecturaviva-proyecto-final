name: LecturaViva CI y APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest backend/test_api.py -q
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lecturaviva
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: LecturaViva-APK
          path: lecturaviva/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Recuperar el APK verificado
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name LecturaViva-APK --dir artifacts
      - name: Publicar Release del tag existente
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/app-release.apk
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "LecturaViva $GITHUB_REF_NAME"
          --notes "APK académico de LecturaViva. Consulta el README para levantar el backend y usarlo desde el emulador."
